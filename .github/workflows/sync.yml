name: sync

on:
  schedule:
    # Odd offsets on purpose: GitHub deprioritizes schedules on round
    # five-minute and top-of-hour marks, which are the most congested.
    # Best-effort either way - a tick can be delayed or skipped.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# Serialize ticks so two runs can never race the data/seen.json ledger.
concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A fresh runner has no committer identity; sync.mjs sets the *author*
      # (which is what the contribution graph counts) but git still refuses to
      # commit without one of these.
      - name: Identify the committer
        run: |
          git config user.name 'rishu-sriv'
          git config user.email '180553705+rishu-sriv@users.noreply.github.com'

      - name: Commit newly accepted submissions
        run: node scripts/sync.mjs

      # No-op push is "Everything up-to-date", exit 0. The rebase only matters
      # if a tick somehow overlapped despite the concurrency group.
      - name: Push
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
